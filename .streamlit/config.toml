[theme]
base = "dark"
primaryColor = "#B69CFF"
backgroundColor = "#0E0F2B"
secondaryBackgroundColor = "#1A1B48"
textColor = "#ECEAFF"
borderColor = "#34356E"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "999px"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap, serif"
chartCategoricalColors = ["#B69CFF", "#6EE7D8", "#FF9EC7", "#FFD18A", "#8FB8FF"]

[theme.sidebar]
backgroundColor = "#13143A"
secondaryBackgroundColor = "#1E1F52"

[server]
headless = false
maxUploadSize = 15

[browser]
gatherUsageStats = false